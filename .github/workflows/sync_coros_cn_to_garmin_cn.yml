name: Sync COROS CN to Garmin CN

on:
  workflow_dispatch:
    inputs:
      activity_id:
        description: Optional COROS CN activity ID
        type: string
        default: ''

concurrency:
  group: dailysync-garmin-cn-coros-cn
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: pnpm
          cache-dependency-path: coros-sync/pnpm-lock.yaml
      - run: pnpm --dir coros-sync install --frozen-lockfile
      - name: Sync COROS activities to Garmin
        env:
          GARMIN_USERNAME: ${{ secrets.GARMIN_USERNAME }}
          GARMIN_SYNC_NUM: ${{ secrets.GARMIN_SYNC_NUM }}
          AESKEY: ${{ secrets.AESKEY }}
          COROS_USERNAME: ${{ secrets.COROS_USERNAME }}
          COROS_PASSWORD: ${{ secrets.COROS_PASSWORD }}
          SYNC_ACTIVITY_ID: ${{ inputs.activity_id }}
        shell: bash
        run: |
          args=(--time-budget 2700)
          if [[ -n "$SYNC_ACTIVITY_ID" ]]; then args+=(--activity-id "$SYNC_ACTIVITY_ID"); fi
          pnpm --dir coros-sync sync_coros_cn_to_garmin_cn "${args[@]}"
