name: Migrate COROS CN to Garmin CN

on:
  workflow_dispatch:

concurrency:
  group: dailysync-garmin-cn-coros-cn
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: pnpm
          cache-dependency-path: coros-sync/pnpm-lock.yaml
      - run: pnpm --dir coros-sync install --frozen-lockfile
      - name: Migrate COROS history to Garmin
        env:
          GARMIN_USERNAME: ${{ secrets.GARMIN_USERNAME }}
          GARMIN_MIGRATE_NUM: ${{ secrets.GARMIN_MIGRATE_NUM }}
          GARMIN_MIGRATE_START: ${{ secrets.GARMIN_MIGRATE_START }}
          GARMIN_MIGRATE_AUTO_PAGE: ${{ secrets.GARMIN_MIGRATE_AUTO_PAGE }}
          AESKEY: ${{ secrets.AESKEY }}
          COROS_USERNAME: ${{ secrets.COROS_USERNAME }}
          COROS_PASSWORD: ${{ secrets.COROS_PASSWORD }}
        shell: bash
        run: |
          migrate_start="${GARMIN_MIGRATE_START:-0}"
          pnpm --dir coros-sync migrate_coros_cn_to_garmin_cn \
            --migrate-start "$migrate_start"
