name: Manage Garmin CN to COROS CN State

on:
  workflow_dispatch:
    inputs:
      operation:
        description: State operation
        type: choice
        required: true
        default: state
        options:
          - initialize
          - state
          - link
          - ignore
          - retry
      source_activity_id:
        description: Garmin CN activity ID (required for link, ignore and retry)
        type: string
        default: ''
      target_activity_id:
        description: COROS CN activity ID (required for link)
        type: string
        default: ''
      confirm_not_imported:
        description: Confirm no COROS import exists (required for retry)
        type: boolean
        default: false

permissions:
  actions: read
  contents: write

jobs:
  manage:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: pnpm
          cache-dependency-path: coros-sync/pnpm-lock.yaml
      - name: Acquire Garmin database writer lock
        id: garmin_db_lock
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/garmin-db-lock.cjs acquire
      - run: pnpm --dir coros-sync install --frozen-lockfile
      - name: Manage Garmin to COROS state
        env:
          GARMIN_USERNAME: ${{ secrets.GARMIN_USERNAME }}
          GARMIN_SYNC_NUM: ${{ secrets.GARMIN_SYNC_NUM }}
          AESKEY: ${{ secrets.AESKEY }}
          COROS_USERNAME: ${{ secrets.COROS_USERNAME }}
          COROS_PASSWORD: ${{ secrets.COROS_PASSWORD }}
          GARMIN_DB_LOCK_COMMIT: ${{ steps.garmin_db_lock.outputs.lock_commit }}
          STATE_OPERATION: ${{ inputs.operation }}
          SOURCE_ACTIVITY_ID: ${{ inputs.source_activity_id }}
          TARGET_ACTIVITY_ID: ${{ inputs.target_activity_id }}
          CONFIRM_NOT_IMPORTED: ${{ inputs.confirm_not_imported }}
        shell: bash
        run: |
          args=("$STATE_OPERATION")
          case "$STATE_OPERATION" in
            initialize)
              pnpm --dir coros-sync initialize_garmin_cn_to_coros_state
              exit
              ;;
            state)
              ;;
            link)
              [[ -n "$SOURCE_ACTIVITY_ID" && -n "$TARGET_ACTIVITY_ID" ]] || { echo "Source and target activity IDs are required." >&2; exit 2; }
              args+=(--source "garmin-cn:$SOURCE_ACTIVITY_ID" --target "coros-cn:$TARGET_ACTIVITY_ID")
              ;;
            ignore)
              [[ -n "$SOURCE_ACTIVITY_ID" ]] || { echo "Source activity ID is required." >&2; exit 2; }
              args+=(--source "garmin-cn:$SOURCE_ACTIVITY_ID" --target coros-cn)
              ;;
            retry)
              [[ -n "$SOURCE_ACTIVITY_ID" && "$CONFIRM_NOT_IMPORTED" == "true" ]] || { echo "Source activity ID and import confirmation are required." >&2; exit 2; }
              args+=(--source "garmin-cn:$SOURCE_ACTIVITY_ID" --target coros-cn --confirm-not-imported)
              ;;
            *)
              echo "Unsupported state operation." >&2
              exit 2
              ;;
          esac
          pnpm --dir coros-sync sync_garmin_cn_to_coros "${args[@]}"
      - name: Release Garmin database writer lock
        if: ${{ always() && steps.garmin_db_lock.outputs.acquired == 'true' }}
        env:
          GARMIN_DB_LOCK_COMMIT: ${{ steps.garmin_db_lock.outputs.lock_commit }}
        run: node .github/scripts/garmin-db-lock.cjs release
