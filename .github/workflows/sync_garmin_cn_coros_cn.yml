name: Sync Garmin CN and COROS CN

on:
  workflow_dispatch:
  schedule:
    # Run two hours after the original Garmin workflows.
    - cron: '0 2,8,14,20 * * *'

concurrency:
  group: dailysync-garmin-cn-coros-cn
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: pnpm
          cache-dependency-path: coros-sync/pnpm-lock.yaml
      - run: pnpm --dir coros-sync install --frozen-lockfile
      - name: Sync Garmin activities to COROS
        id: garmin_to_coros
        continue-on-error: true
        env:
          GARMIN_USERNAME: ${{ secrets.GARMIN_USERNAME }}
          GARMIN_SYNC_NUM: ${{ secrets.GARMIN_SYNC_NUM }}
          AESKEY: ${{ secrets.AESKEY }}
          COROS_USERNAME: ${{ secrets.COROS_USERNAME }}
          COROS_PASSWORD: ${{ secrets.COROS_PASSWORD }}
        run: pnpm --dir coros-sync sync_garmin_cn_to_coros --time-budget 2700
      - name: Sync COROS activities to Garmin
        id: coros_to_garmin
        continue-on-error: true
        env:
          GARMIN_USERNAME: ${{ secrets.GARMIN_USERNAME }}
          GARMIN_SYNC_NUM: ${{ secrets.GARMIN_SYNC_NUM }}
          AESKEY: ${{ secrets.AESKEY }}
          COROS_USERNAME: ${{ secrets.COROS_USERNAME }}
          COROS_PASSWORD: ${{ secrets.COROS_PASSWORD }}
        run: pnpm --dir coros-sync sync_coros_cn_to_garmin_cn --time-budget 2700
      - name: Check synchronization results
        if: ${{ always() && (steps.garmin_to_coros.outcome == 'failure' || steps.coros_to_garmin.outcome == 'failure') }}
        run: exit 1
